# Build the cross-platform native binaries for @deepseek-ai/node-addon-system.
#
# The release:pack gate (native/system/scripts/verify-launcher-binary.mjs)
# refuses to pack a platform package whose declared binary is missing or built
# for the wrong architecture. A single Linux box can therefore never produce a
# complete publish set: darwin-arm64 needs a Mach-O built on Apple silicon, and
# linux-arm64 needs an ARM runner.
#
# Upstream solves this with native/system's own release workflow. This fork uses
# the same matrix but stops short of npm: the binaries are committed back to the
# branch so the ordinary `pnpm run build` + `release:pack` path works locally.
name: Build native prebuilds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      prebuilds: ${{ steps.matrix.outputs.prebuilds }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "prebuilds=$(node ./scripts/github-matrix.mjs release-prebuild)" >> "$GITHUB_OUTPUT"
        working-directory: native/system

  build:
    name: ${{ matrix.package }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.prebuilds) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter @deepseek-ai/node-addon-system-workspace... --frozen-lockfile

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools

      - name: Build native binaries
        run: pnpm build:native
        working-directory: native/system

      - name: Verify binary metadata
        run: node ./scripts/verify-launcher-binary.mjs ${{ matrix.dir }}
        working-directory: native/system

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/system/${{ matrix.dir }}/bin/**
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit prebuilds
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: native/system/prebuilds-staging

      - name: Place binaries into their packages
        run: |
          set -euo pipefail
          cd native/system
          for dir in prebuilds-staging/*; do
            name="$(basename "$dir")"
            pkg="${name#prebuild-}"
            echo "== $pkg"
            find "$dir" -type f | head -20
            mkdir -p "packages/$pkg/bin"
            cp -R "$dir"/. "packages/$pkg/bin/"
          done
          rm -rf prebuilds-staging

      - name: Report what landed
        run: |
          find native/system/packages -name 'system.node' -o -name 'landlock-run' | sort

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "dsh-stan bot"
          git config user.email "bot@dsh-stan.local"
          git add -A native/system/packages
          if git diff --cached --quiet; then
            echo "no binary changes"
            exit 0
          fi
          git commit -m "build(native): cross-platform prebuilds

          Produced by the Build native prebuilds workflow across
          darwin-arm64, darwin-x64, linux-arm64 and linux-x64 runners."
          git push
